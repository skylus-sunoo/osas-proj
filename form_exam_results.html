<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        td {
            padding-top: 2px;
            padding-bottom: 2px;
        }

        body {
            padding: 2rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.7rem;
        }

        .bold {
            font-weight: bold;
        }

        .highlight {
            color: white;
            background-color: grey;
            text-decoration: underline;

            text-align: center !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        hr {
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .section-title {
            padding-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .header {
            margin-bottom: 1rem;
        }

        .header * {
            width: 100%;
            text-align: center;
        }

        .header img {
            max-width: 100px;
        }

        .results-table {
            border: 1px solid black;
            padding-left: 3px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <header>
        <table class="header">
            <tr>
                <td style="width: 70%;">
                    <img src="assets/img/logo.png">
                </td>
                <td>
                    <p style="font-size: 1rem;">Republic of the Philippines</p>
                    <p class="bold" style="font-size: 1.25rem;">CAVITE STATE UNIVERSITY</p>
                    <p class="bold" style="font-size: 1rem;">Silang Campus</p>
                    <p style="font-size: 1rem;"><i>Biga 1, Silang, Cavite</i></p>
                </td>
                <td style="width: 70%;">
                </td>
            </tr>
            <br>
            <tr>
                <td colspan="3" class="bold" style="font-size: 1.25rem;">
                    LIST OF QUALIFIED APPLICANTS OF CVSU SILANG CAMPUS <br>
                    1ST SEMESTER, SY {{ sy }}
                </td>
            </tr>
        </table>
    </header>

    <body>
        <section>
            <p class="section-title"><b>Reminder:</b></p>
            <p class="section-title"><b></b></p>
            <p class="section-title"><b></b></p>
            <p class="section-title"><b></b></p>
        </section>

        <section>
            <table>
                <thead>
                    <tr>
                        <th class="bold results-table" style="width: 200px; border-width: 2px;">CONTROL NUMBER</td>
                        <th class="bold results-table" style="text-align: left; border-width: 2px;">PROGRAM</td>
                    </tr>
                </thead>

                <tbody>
                    {{ rows }}
                </tbody>
            </table>
        </section>
    </body>
</body>

</html>
